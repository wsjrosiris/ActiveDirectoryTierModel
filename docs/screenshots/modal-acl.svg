<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="900" height="550" fill="#0b0d14"/>
  <!-- Background blur effect -->
  <rect width="900" height="550" fill="rgba(0,0,0,0.7)"/>
  <!-- Sidebar (blurred) -->
  <rect width="200" height="550" fill="#141821" opacity="0.5"/>
  <!-- Main (blurred) -->
  <rect x="200" y="0" width="700" height="550" fill="#0b0d14" opacity="0.5"/>
  <!-- Modal -->
  <rect x="180" y="40" width="540" height="470" rx="14" fill="#141821" stroke="#2a3042" stroke-width="1"/>
  <text x="210" y="75" fill="#f0f2f8" font-size="16" font-weight="700">Neue ACL Delegation</text>
  <!-- OU Path -->
  <text x="210" y="110" fill="#a0a8c0" font-size="11" font-weight="600">Target OU-Pfad</text>
  <rect x="210" y="118" width="480" height="32" rx="8" fill="#1c2130" stroke="#2a3042" stroke-width="1"/>
  <text x="222" y="139" fill="#f0f2f8" font-size="12">OU=Tier 0 Accounts,{{DOMAIN_DN}}</text>
  <!-- Principal & Type -->
  <text x="210" y="172" fill="#a0a8c0" font-size="11" font-weight="600">Principal (Gruppe)</text>
  <rect x="210" y="180" width="230" height="32" rx="8" fill="#1c2130" stroke="#2a3042" stroke-width="1"/>
  <text x="222" y="201" fill="#f0f2f8" font-size="12">Tier1Admins ▾</text>
  <text x="460" y="172" fill="#a0a8c0" font-size="11" font-weight="600">Access Control Type</text>
  <rect x="460" y="180" width="230" height="32" rx="8" fill="#1c2130" stroke="#2a3042" stroke-width="1"/>
  <text x="472" y="201" fill="#5dd9a0" font-size="12">Allow ▾</text>
  <!-- Objekttyp -->
  <text x="210" y="235" fill="#a0a8c0" font-size="11" font-weight="600">Objekttyp</text>
  <rect x="210" y="243" width="480" height="32" rx="8" fill="#1c2130" stroke="#2a3042" stroke-width="1"/>
  <text x="222" y="264" fill="#f0f2f8" font-size="12">User ▾</text>
  <!-- Rechte -->
  <text x="210" y="300" fill="#a0a8c0" font-size="11" font-weight="600">Active Directory Rechte</text>
  <!-- Rights grid -->
  <rect x="210" y="310" width="14" height="14" rx="2" fill="#6b9aff"/>
  <text x="230" y="322" fill="#f0f2f8" font-size="11">GenericAll</text>
  <rect x="340" y="310" width="14" height="14" rx="2" fill="#6b9aff"/>
  <text x="360" y="322" fill="#f0f2f8" font-size="11">CreateChild</text>
  <rect x="480" y="310" width="14" height="14" rx="2" fill="#6b9aff"/>
  <text x="500" y="322" fill="#f0f2f8" font-size="11">DeleteChild</text>
  <rect x="210" y="336" width="14" height="14" rx="2" stroke="#2a3042" stroke-width="1" fill="transparent"/>
  <text x="230" y="348" fill="#f0f2f8" font-size="11">ReadProperty</text>
  <rect x="340" y="336" width="14" height="14" rx="2" stroke="#2a3042" stroke-width="1" fill="transparent"/>
  <text x="360" y="348" fill="#f0f2f8" font-size="11">WriteProperty</text>
  <rect x="480" y="336" width="14" height="14" rx="2" stroke="#2a3042" stroke-width="1" fill="transparent"/>
  <text x="500" y="348" fill="#f0f2f8" font-size="11">ExtendedRight</text>
  <rect x="210" y="362" width="14" height="14" rx="2" stroke="#2a3042" stroke-width="1" fill="transparent"/>
  <text x="230" y="374" fill="#f0f2f8" font-size="11">Delete</text>
  <rect x="340" y="362" width="14" height="14" rx="2" stroke="#2a3042" stroke-width="1" fill="transparent"/>
  <text x="360" y="374" fill="#f0f2f8" font-size="11">DeleteTree</text>
  <rect x="480" y="362" width="14" height="14" rx="2" stroke="#2a3042" stroke-width="1" fill="transparent"/>
  <text x="500" y="374" fill="#f0f2f8" font-size="11">GenericExecute</text>
  <!-- Vererbung -->
  <text x="210" y="405" fill="#a0a8c0" font-size="11" font-weight="600">Vererbungstyp</text>
  <rect x="210" y="413" width="480" height="32" rx="8" fill="#1c2130" stroke="#2a3042" stroke-width="1"/>
  <text x="222" y="434" fill="#f0f2f8" font-size="12">All ▾</text>
  <!-- Buttons -->
  <line x1="210" y1="465" x2="690" y2="465" stroke="#2a3042" stroke-width="1"/>
  <rect x="510" y="478" width="80" height="32" rx="8" fill="transparent" stroke="#2a3042" stroke-width="1"/>
  <text x="530" y="499" fill="#f0f2f8" font-size="12" font-weight="600">Abbrechen</text>
  <rect x="600" y="478" width="90" height="32" rx="8" fill="#6b9aff"/>
  <text x="618" y="499" fill="#000" font-size="12" font-weight="600">Hinzufuegen</text>
</svg>
