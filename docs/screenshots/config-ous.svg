  <rect x="245" y="380" width="270" height="22" rx="5" fill="#1c2130" stroke="#2a3042" stroke-width="1"/>
  <text x="253" y="395" fill="#f0f2f8" font-size="10">Tier 0 Accounts</text>
  <text x="245" y="415" fill="#707890" font-size="8">PFAD</text>
  <rect x="245" y="420" width="270" height="22" rx="5" fill="#1c2130" stroke="#2a3042" stroke-width="1"/>
  <text x="253" y="435" fill="#f0f2f8" font-size="10">OU=Tier 0,OU=Tier Model Administration</text>
